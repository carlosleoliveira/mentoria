name: Deploy Workflow

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}
          aws-region: us-east-1
    
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
    
      - name: Build, tag, and push image to Amazon ECR
        env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: mentoria
            IMAGE_TAG: ${{ github.event.repository.name }}-${{ github.run_number }}
        run: |
            # Build the Docker image
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            
            # Push the Docker image to Amazon ECR
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  test:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install the code linting and formatting tool Ruff
        run: pipx install ruff
      
      - name: Lint code with Ruff
        run: ruff check --output-format=github --target-version=py39
      
      - name: Check code formatting with Ruff
        run: ruff format --diff --target-version=py39
        continue-on-error: false
  
  approval:
    needs: [build, test]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Request manual approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.ACTOR}}
          minimum-approvals: 1
          issue-title: "Manual Approval Required for Deployment"
          issue-body: "Please approve or deny the deployment"
      
  deploy:
    needs: [build, test, approval]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Docker Login
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

      - name: Run Docker container
        run: |
          IMAGE_TAG=${{ github.event.repository.name }}-${{ github.run_number }}
          docker run ${{ steps.login-ecr.outputs.registry }}/mentoria:$IMAGE_TAG
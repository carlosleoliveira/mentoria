name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  COVERAGE_MIN: 70

jobs:
  # ---------------------------------------------------------------
  # 1. LINT — primeiro stage; se falhar, nada mais roda
  # ---------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar Ruff
        run: pipx install ruff

      - name: Lint
        run: ruff check --output-format=github .

      - name: Formatação
        run: ruff format --check --diff .

  # ---------------------------------------------------------------
  # 2. TESTES + COBERTURA MÍNIMA
  # ---------------------------------------------------------------
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Rodar testes com cobertura
        run: |
          pytest \
            --cov=hello \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_MIN }}

  # ---------------------------------------------------------------
  # 3. VARREDURA DE SEGURANÇA (Trivy na imagem Docker)
  #    Builda a imagem localmente (sem push) e quebra em HIGH/CRITICAL.
  #    Roda também em PR.
  # ---------------------------------------------------------------
  security-scan:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build local da imagem
        run: docker build -t app-scan:${{ github.sha }} .

      - name: Trivy (imagem)
        uses: aquasecurity/trivy-action@0.35.0   # versão segura pós-incidente de mar/2026
        with:
          version: v0.69.3
          scan-type: image
          image-ref: app-scan:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ---------------------------------------------------------------
  # 4. BUILD + PUSH NO GHCR (só em push para main/develop)
  # ---------------------------------------------------------------
  build:
    needs: [test, security-scan]
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      app_env: ${{ steps.meta.outputs.app_env }}
    steps:
      - uses: actions/checkout@v5

      - name: Definir nome, tag e ambiente
        id: meta
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"      # ghcr exige minúsculas
          TAG="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"         # develop-abc1234 / main-abc1234
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            APP_ENV=production
          else
            APP_ENV=development
          fi
          echo "image=$IMAGE"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "app_env=$APP_ENV" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.meta.outputs.tag }} \
            --build-arg APP_ENV=${{ steps.meta.outputs.app_env }} \
            -t ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} \
            .

      - name: Push
        run: docker push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  # ---------------------------------------------------------------
  # 5. DEPLOY — job único; o environment define o destino.
  #    "production" tem required reviewers → pausa para aprovação.
  # ---------------------------------------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.app_env }}   # development (develop) | production (main)
    permissions:
      packages: read
    steps:
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull da imagem publicada
        run: docker pull ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}

      - name: Rodar aplicação e conferir versão
        run: |
          OUTPUT=$(docker run --rm ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }})
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qx "Version: ${{ needs.build.outputs.tag }}" \
            || { echo "::error::Versão exibida não bate com a tag da imagem"; exit 1; }